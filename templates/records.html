<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Swap Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
        }
        .table img {
            object-fit: cover;
            border-radius: 4px;
        }
        .badge {
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Face Swap History</h1>
        <div class="card mb-4">
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Task ID</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Processing Time</th>
                            <th>Source Image</th>
                            <th>Target Image</th>
                            <th>Result</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for record in records %}
                        <tr>
                            <td>{{ record.task_id }}</td>
                            <td>
                                <span class="badge bg-{{ 'success' if record.status == 'completed' else 'danger' }}">
                                    {{ record.status }}
                                </span>
                            </td>
                            <td>{{ record.created_at }}</td>
                            <td>{{ "%.2f"|format(record.processing_time or 0) }}s</td>
                            <td>
                                <img src="/source-image/{{ record.task_id }}" width="50" height="50" alt="Source" 
                                     onerror="this.src='https://via.placeholder.com/50?text=Source'">
                            </td>
                            <td>
                                <img src="/target-image/{{ record.task_id }}" width="50" height="50" alt="Target" 
                                     onerror="this.src='https://via.placeholder.com/50?text=Target'">
                            </td>
                            <td>
                                <img src="{{ record.enhanced_output_path }}" width="100" height="100" alt="Result" 
                                     onerror="this.src='https://via.placeholder.com/100?text=Result'">
                            </td>
                            <td>
                                <a href="/progress/{{ record.task_id }}" class="btn btn-sm btn-info me-1">Progress</a>
                                <a href="{{ record.enhanced_output_path }}" class="btn btn-sm btn-success" download>Download</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
